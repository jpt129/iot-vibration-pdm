# Dashboard provider - tells Grafana to load JSON files from disk on boot
apiVersion: 1

providers:
  - name:            'iot-pdm'
    orgId:           1
    folder:          ''
    folderUid:       ''
    type:            file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates:  true
    options:
      path:          /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: false
