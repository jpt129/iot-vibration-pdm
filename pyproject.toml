[project]
name            = "iot-pdm"
version         = "0.1.0"
description     = "Multimodal vibration predictive maintenance pipeline"
readme          = "README.md"
requires-python = ">=3.12"
license         = {text = "MIT"}

dependencies = [
    "aiomqtt==2.3.0",
    "asyncpg==0.30.0",
    "pydantic==2.9.2",
    "pydantic-settings==2.6.1",
    "structlog==24.4.0",
    "tenacity==9.0.0",
    "fastapi==0.115.5",
    "uvicorn[standard]==0.32.1",
    "scikit-learn==1.5.2",
    "numpy==2.1.3",
    "pandas==2.2.3",
    "joblib==1.4.2",
    "prometheus-fastapi-instrumentator==7.0.0",
    "orjson==3.10.11",
    "typer==0.13.1",
    "httpx==0.27.2",
    "sqlalchemy==2.0.36",
    "psycopg[binary]==3.2.3",
    "aiohttp==3.11.10",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "ruff==0.8.4",
    "mypy==1.13.0",
]
streamlit = [
    "streamlit==1.40.1",
    "plotly==5.24.1",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "ASYNC", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
